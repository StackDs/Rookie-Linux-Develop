# Rookie Linux Mint Preseed
# Dejamos las configuraciones en blanco para mantener la instalacion interactiva.

# Al finalizar la instalacion exitosamente (success_command), inyectamos y ejecutamos nuestros scripts
d-i ubiquity/success_command string \
    mkdir -p /target/opt/rookie-scripts; \
    cp -r /cdrom/custom_scripts/* /target/opt/rookie-scripts/; \
    chmod -R +x /target/opt/rookie-scripts/scripts/*.sh; \
    in-target bash -c "/opt/rookie-scripts/scripts/install.sh > /var/log/rookie-install.log 2>&1"
